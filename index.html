<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Comp Plan Simulator</title>
    <meta name="description" content="Unofficial simulator that shows how a compensation plan calculates income from your own assumptions. Everything stays in your browser." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#1173bc" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet" />
    <script>
      // Set the theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('comp-plan-simulator:v1') || '{}');
        var dark = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This app needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
